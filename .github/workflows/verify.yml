name: Verify Fintech Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Backend Dependencies
        run: cd fintech-core && npm install
      - name: Build Backend
        run: cd fintech-core && npm run build

  frontend-check:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Use Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
        - name: Install Frontend Dependencies
          run: cd fintech-ui && npm install
        - name: Build Frontend
          run: cd fintech-ui && npm run build
